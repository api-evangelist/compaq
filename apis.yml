x-domain-note: 'compaq.com resolves (A 15.72.22.98) on HP nameservers (ns1-ns6.hp.com) and
  is registered to HP Inc. via MarkMonitor, created 1995-04-20, expiry 2027-04-21, with all
  three clientDelete/Transfer/UpdateProhibited locks set. It serves no HTTP or HTTPS content
  — both ports 80 and 443 time out — and www., developer., api., docs. and support.compaq.com
  are all NXDOMAIN. Mail is fully disavowed (SPF "v=spf1 -all"); _dmarc.compaq.com CNAMEs
  to HP''s _dmarc.ext.hp.com with p=reject. No CAA and no DNSSEC. It is a defensively held
  brand domain, not a live property, and is deliberately not wired as a Website pointer.'
