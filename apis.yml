name: Compaq
description: Compaq Computer Corporation was a personal-computer manufacturer founded on
  February 16, 1982 in Houston, Texas by Rod Canion, Jim Harris and Bill Murto, three former
  Texas Instruments executives. It legally reverse-engineered the IBM PC BIOS and shipped
  the Compaq Portable in March 1983, then built out the Deskpro desktop line, the LTE notebook
  line, the Presario consumer line, and the SystemPro and ProLiant server lines, becoming
  the world's largest PC maker by 1994. Losing ground to Dell's direct-sales model and hit
  by the dot-com collapse, Compaq agreed to merge with Hewlett-Packard on September 4, 2001
  in a $24.2 billion deal that closed on May 3, 2002. HP retired the Compaq brand entirely
  in North America and Europe in 2013 and has since licensed it regionally to third parties
  (Positivo Tecnologia in Brazil, Grupo Newsan in Argentina, Triden Corp in Mexico, Ossify
  Industries in India). Compaq predates the public web-API era and never published a developer
  program, public API, or SDK of its own; the compaq.com domain is still registered to HP
  Inc. but serves no website. This profile is retained as a historical record; there is no
  API surface to enrich.
